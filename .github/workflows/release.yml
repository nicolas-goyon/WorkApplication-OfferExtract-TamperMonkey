name: Build & publish bundle (jsdelivr)

# Builds the Tampermonkey bundle and publishes it as a `vX.Y.Z` tag, so
# jsdelivr can serve a frozen artifact:
#   https://cdn.jsdelivr.net/gh/<user>/<repo>@vX.Y.Z/dist/tampermonkey-offerextract.js
#
# Release flow (fully automatic):
#   1. Push to main (touching src/, package.json/lock, tsconfig.json, or
#      scripts/) — CI figures out the next version itself:
#        - default: patch bump (vX.Y.Z -> vX.Y.Z+1)
#        - any pushed commit message contains "[minor]" -> minor bump, patch reset
#        - any pushed commit message contains "[major]" -> major bump, minor+patch reset
#      "[major]" wins over "[minor]" if both are present in the same push.
#   2. CI typechecks + builds + verifies the bundle, commits dist/ onto a
#      detached commit built from that push, then creates/pushes the new tag
#      pointing at it. main itself is never touched by this workflow.
#   3. The jsdelivr URL @vX.Y.Z now contains dist/.
#
# Manual escape hatches (workflow_dispatch):
#   - Leave "tag" empty, optionally set "bump" -> cuts a release the same way
#     as an automatic push, from whatever branch/ref you run it against.
#   - Set "tag" to an existing vX.Y.Z -> rebuilds that exact tag in place
#     (e.g. to recover from a broken jsdelivr cache), bump is ignored.

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'scripts/**'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild in place, e.g. v1.0.0 (leave empty to cut a new release)'
        required: false
      bump:
        description: 'Version bump for a new release (ignored if "tag" is set)'
        required: false
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve the release tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_BUMP: ${{ github.event.inputs.bump }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          latest_tag() {
            git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n1
          }

          next_version() {
            local bump="$1"
            local latest
            latest="$(latest_tag)"
            latest="${latest:-v0.0.0}"
            local ver="${latest#v}"
            IFS='.' read -r major minor patch <<< "$ver"
            case "$bump" in
              major) major=$((major + 1)); minor=0; patch=0 ;;
              minor) minor=$((minor + 1)); patch=0 ;;
              *)     patch=$((patch + 1)) ;;
            esac
            echo "v${major}.${minor}.${patch}"
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${INPUT_TAG:-}" ]; then
            # Rebuild an explicit, already-existing tag in place.
            echo "name=${INPUT_TAG}" >> "$GITHUB_OUTPUT"
            echo "needs_checkout=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            bump="${INPUT_BUMP:-patch}"
          else
            # Push to main: scan the pushed commit messages for [minor]/[major].
            zero_sha="0000000000000000000000000000000000000000"
            if [ -z "${BEFORE_SHA:-}" ] || [ "${BEFORE_SHA}" = "$zero_sha" ]; then
              messages="$(git log -1 --pretty=%B "$AFTER_SHA")"
            else
              messages="$(git log --pretty=%B "${BEFORE_SHA}..${AFTER_SHA}")"
            fi
            if grep -qi '\[major\]' <<< "$messages"; then
              bump="major"
            elif grep -qi '\[minor\]' <<< "$messages"; then
              bump="minor"
            else
              bump="patch"
            fi
          fi
          echo "Bump: $bump"

          new_tag="$(next_version "$bump")"
          if git rev-parse -q --verify "refs/tags/${new_tag}" >/dev/null; then
            echo "::error::Computed tag ${new_tag} already exists — refusing to overwrite it. Rebuild it explicitly via workflow_dispatch if that's intended."
            exit 1
          fi

          echo "name=${new_tag}" >> "$GITHUB_OUTPUT"
          echo "needs_checkout=false" >> "$GITHUB_OUTPUT"

      - name: Checkout the existing tag
        if: steps.tag.outputs.needs_checkout == 'true'
        run: git checkout "${{ steps.tag.outputs.name }}"

      # Guard: if the commit we're about to build from is already a build
      # commit (dist/ present and up to date), stop here. Only matters for
      # the explicit-tag rebuild path — new releases are always cut from a
      # fresh (non-build) commit.
      - name: Detect an already-built tag
        id: guard
        run: |
          if git log -1 --pretty=%s | grep -q '^ci(build):'; then
            echo "already_built=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.guard.outputs.already_built == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        if: steps.guard.outputs.already_built == 'false'
        run: npm install

      - name: Typecheck
        if: steps.guard.outputs.already_built == 'false'
        run: npm run typecheck

      - name: Build
        if: steps.guard.outputs.already_built == 'false'
        run: npm run build

      - name: Verify the bundle (present and non-empty)
        if: steps.guard.outputs.already_built == 'false'
        run: |
          f=dist/tampermonkey-offerextract.js
          test -s "$f" || { echo "::error::$f missing or empty"; exit 1; }
          echo "OK: $f ($(wc -c < "$f") bytes)"

      - name: Commit dist/ and reposition the tag
        if: steps.guard.outputs.already_built == 'false'
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          if git diff --cached --quiet; then
            echo "No change in dist/, nothing to publish."
            exit 0
          fi
          git commit -m "ci(build): dist for ${TAG}"
          git tag -f "${TAG}"
          git push origin "${TAG}" --force
